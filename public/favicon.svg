<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fondo con esquinas redondeadas imitando el estilo de la imagen -->
  <rect width="100" height="100" rx="22" fill="#0d1527"/>
  
  <!-- Texto "JP" centrado con el color azul brillante característico -->
  <text x="50%" y="54%" 
        dominant-baseline="central" 
        text-anchor="middle" 
        fill="#3abff8" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="46"
        letter-spacing="-1">JP</text>
</svg>
